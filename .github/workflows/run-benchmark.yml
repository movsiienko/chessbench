name: Run benchmark

# Starts a benchmark run on production through the admin endpoint. Only people
# with write access to the repository can dispatch it; the token stays a
# repository secret. See README.md "Benchmark Runs".
on:
  workflow_dispatch:
    inputs:
      models:
        description: Gateway model IDs from lib/benchmarks/models.ts, comma-separated
        required: true
        default: openai/gpt-5.5
      limit:
        description: Puzzles per model from the deterministic sample (1-500)
        required: true
        default: "10"
      bands:
        description: Optional rating bands, comma-separated (e.g. under-1200)
        required: false
        default: ""
      reasoning:
        description: Reasoning level
        type: choice
        default: provider-default
        options:
          - provider-default
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
      dry_run:
        description: Only report what would run
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  start:
    name: Start run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the run
        env:
          # Repository variable, so a domain change needs no code change.
          BASE_URL: ${{ vars.CHESSBENCH_URL }}
          TOKEN: ${{ secrets.BENCHMARK_ADMIN_TOKEN }}
          MODELS: ${{ inputs.models }}
          LIMIT: ${{ inputs.limit }}
          BANDS: ${{ inputs.bands }}
          REASONING: ${{ inputs.reasoning }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the CHESSBENCH_URL repository variable to the production URL"
            exit 1
          fi
          # A non-numeric limit is sent as text so the endpoint explains the error.
          body=$(jq -n \
            --arg models "$MODELS" --arg limit "$LIMIT" --arg bands "$BANDS" \
            --arg reasoning "$REASONING" --arg dry "$DRY_RUN" '
              def list: split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""));
              {
                models: ($models | list),
                items: ({limit: (try ($limit | tonumber) catch $limit)}
                  + (if ($bands | list) == [] then {} else {bands: ($bands | list)} end)),
                reasoning: $reasoning,
                dryRun: ($dry == "true")
              }')
          # Keep the response body on errors: the endpoint says what was wrong.
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "$BASE_URL/api/benchmark-runs" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body")
          cat response.json; echo
          {
            echo "### Benchmark run: HTTP $status$([ "$DRY_RUN" = true ] && echo ' (dry run)')"
            echo
            echo '```json'
            echo "$body"
            echo '```'
            echo
            echo '```'
            cat response.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 404 ]; then
            echo "::error::404: the BENCHMARK_ADMIN_TOKEN secret does not match production, or CHESSBENCH_URL is wrong"
          fi
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
